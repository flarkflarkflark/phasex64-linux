# PHASE X64 USB: keep the card on PipeWire's "Pro Audio" device profile
# with its ALSA nodes pinned to native format/rate, so REAPER (or any
# JACK client, via pipewire-jack) can use the device through PipeWire
# instead of needing it stopped first - while desktop audio (browser,
# media players) keeps working on the same card at the same time.
#
# See linux/README.md, "PipeWire / JACK", for what this does, how to
# install/verify it, and how to roll it back (removing this file and
# restarting wireplumber restores today's behaviour exactly - this file
# only ever *adds* update-props actions on top of whatever WirePlumber
# would otherwise have picked; it creates no new device or node, and
# nothing else in this project reads or depends on it existing).
#
# Verified against THIS machine's actual device/node names (not a
# guessed regex - see the README section for how to re-derive these if
# the device ever enumerates differently, e.g. after a USB hub change):
#
#   pw-dump | grep -A2 'device.name.*PHASE_X64'
#   wpctl status                     # confirms Active Profile, sink/source
#
# device.name  = alsa_card.usb-MUSONIK_GmbH_MUSONIK_GmbH_PHASE_X64_USB_no_serial_number-00
# node.name    = alsa_output.usb-MUSONIK_GmbH_MUSONIK_GmbH_PHASE_X64_USB_no_serial_number-00.pro-output-0
#                alsa_input.usb-MUSONIK_GmbH_MUSONIK_GmbH_PHASE_X64_USB_no_serial_number-00.pro-input-0
# USB id       = 0a4a:5b01 (Ploytec GmbH MUSONIK GmbH PHASE X64 USB)
#
# The "-00" suffix and "no_serial_number" are udev's own disambiguation
# for a device that reports no USB serial number - stable as long as
# only one PHASE X64 is ever plugged in (this project's only supported
# case). The regexes below anchor on the fixed vendor/product string
# only, not the "-00" suffix, so a future re-enumeration with a
# different trailing index would still match.
#
# Syntax (monitor.alsa.rules, matches/actions, SPA-JSON) verified
# against this system's own
# /usr/share/doc/wireplumber/examples/wireplumber.conf.d/alsa.conf
# (WirePlumber 0.5.18) - every property below is documented there with
# its default and accepted values; nothing here is guessed.

monitor.alsa.rules = [
  {
    # Device-level: force the "Pro Audio" profile (raw multi-channel
    # ports: 4ch playback = Out 1/2 + Out 3/4, 6ch capture = In 1/2 +
    # In 3/4 + the Out 1/2 digital tap) instead of whatever consumer
    # stereo profile ACP would otherwise pick.
    matches = [
      { device.name = "~alsa_card\\.usb-MUSONIK_GmbH_MUSONIK_GmbH_PHASE_X64_USB.*" }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
  {
    # Node-level: both the playback (pro-output-0, 4ch) and capture
    # (pro-input-0, 6ch) nodes created once the profile above is
    # active. One rule for both - the properties below apply the same
    # way regardless of channel count.
    matches = [
      { node.name = "~alsa_(output|input)\\.usb-MUSONIK_GmbH_MUSONIK_GmbH_PHASE_X64_USB.*" }
    ]
    actions = {
      update-props = {
        # Native rate only, no resampling. audio.allowed-rates (rather
        # than just audio.rate) stops WirePlumber from silently
        # resampling to match some *other* device's rate if this card
        # is ever not the one driving the graph's shared clock -
        # relevant once PipeWire/JACK clients share the graph with
        # desktop audio, unlike the old exclusive-access-only config.
        audio.rate = 48000
        audio.allowed-rates = [ 48000 ]

        # audio.format deliberately *not* pinned here, unlike rate:
        # the driver offers exactly one native format per direction,
        # but they differ - playback is S24_3LE (PipeWire "S24LE"),
        # capture is S32_LE (PipeWire "S32LE") - see phasex64.c's
        # px_play_hw/px_cap_hw. Since this one rule matches both the
        # playback and capture node, a single audio.format value here
        # would be right for one direction and silently wrong for the
        # other (and S32LE on the playback node, or S24LE on the
        # capture node, is not a format this device actually has -
        # ACP already negotiates the correct one per node on its own,
        # so there is nothing to gain by pinning it and a real way to
        # get it wrong by doing so).

        # No resampling, no channel remixing, no automatic volume
        # scaling on the hardware boundary - this node's own
        # ALSA<->graph conversion stays a straight passthrough, since
        # audio.format/rate above already match the hardware exactly
        # and there is nothing left to convert. This is a different
        # mixing stage from how an individual *client stream* (e.g. a
        # browser's stereo output) gets routed onto this node's
        # channels - see the README section on desktop audio, below.
        resample.disable = true
        channelmix.disable = true

        # false: no software per-channel volume compensation layered
        # in front of the hardware - the signal path stays whatever
        # the device's own hardware mixer/RIAA/routing (driven by the
        # panel, not PipeWire) already is. This does not take away the
        # desktop volume slider (wpctl set-volume/pactl) - that is a
        # separate, always-available software gain stage applied to
        # the *stream*, not this property; turning it down still
        # scales samples (by definition any software gain does), it is
        # simply not something this config should disable, since
        # desktop users still need a volume control.
        monitor.channel-volumes = false

        # api.alsa.period-size/api.alsa.headroom deliberately left
        # unset: a fixed ALSA period here would conflict with a small
        # PipeWire quantum (e.g. REAPER's 256-frame test in the
        # README) - PipeWire derives the ALSA period from the actual
        # graph quantum on its own, and there is no justification for
        # overriding either away from that default for this device.
        # For JACK-side latency tuning, use
        # `pw-metadata -n settings 0 clock.force-quantum <N>`
        # instead of changing this file - that is a graph-wide
        # setting, not specific to this device, and does not require
        # restarting wireplumber.

        # Never suspend (close) this device while idle - the default
        # (5s, see suspend-node.lua) would otherwise close and reopen
        # the ALSA device every time nothing has played/recorded for a
        # few seconds. Trade-off (see README "PipeWire / JACK",
        # "Suspend" for the full explanation): with this set, the
        # device is *never* idle-closed, so MIDI (which this driver
        # only carries while a PCM stream is open - see "MIDI only
        # works while a PCM stream is active" in README) keeps working
        # at all times instead of only right after audio last played;
        # the cost is that the USB device - and its own hardware
        # clock/DAC/ADC - stays continuously active even with nothing
        # to do. Set this back to 5 (or remove the line to take the
        # default) if you would rather the device power down when idle
        # and only pay the reopen cost when audio resumes.
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
